<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrustFlow AI: clear agreements, fair payments</title>
  <meta name="description" content="Describe a freelance deal in your own words. AI turns it into milestones with clear checks, and PayPal holds each payment until the work is approved.">
  <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161b24" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <button type="button" id="menu-button" class="icon-button menu-button" aria-label="Agreements" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/" data-nav>
      <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <path d="M5 23 C 11 23, 11 9, 17 9 S 23 23, 27 23" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="5" cy="23" r="3.2" fill="var(--mint)"/><circle cx="17" cy="9" r="3.2" fill="var(--amber)"/><circle cx="27" cy="23" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>TrustFlow</span>
    </a>
    <div class="role-switch" role="group" aria-label="View as">
      <span class="role-label">Viewing as</span>
      <button type="button" data-role="client" aria-pressed="true">Client</button>
      <button type="button" data-role="freelancer" aria-pressed="false">Freelancer</button>
    </div>
    <span class="env-pill" id="env-pill">PayPal sandbox</span>
  </header>
  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Agreements"></nav>
    <main id="main" tabindex="-1"></main>
    <aside class="agent-column" id="agent" aria-label="Payment agent" hidden></aside>
  </div>
  <div class="toasts" id="toasts"></div>
  <dialog id="dialog" class="dialog"></dialog>
</body>
</html>
