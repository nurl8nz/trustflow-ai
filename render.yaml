# One-click deploy: Render Dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: trustflow-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DEMO_CLIENT_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false